upstream api {
  # Com várias réplicas da API, o Docker devolve todos os IPs e o nginx distribui entre eles.
  server api:3000 max_fails=3 fail_timeout=10s;
  keepalive 32;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Arquivos com hash no nome nunca mudam: cache de 1 ano.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    # Se uma réplica cair no meio, tenta outra (só para métodos seguros).
    proxy_next_upstream error timeout http_502 http_503;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
