name: CI

on:
  push:
    branches: [main, 'CLAUDE/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rápido e sem dependências externas: roda primeiro e dá o retorno em ~1 min.
  unit:
    name: Tipos + testes unitários (cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=reports/unit.xml
      - name: Resumo da cobertura
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Cobertura dos testes unitários", "| Métrica | % | Cobertos |", "|---|---|---|",
              ...["lines","statements","functions","branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-unitarios
          path: |
            coverage/
            reports/
          retention-days: 14

  integration:
    name: Testes de integração (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: openwallet_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration -- --reporter=default --reporter=junit --outputFile.junit=reports/integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-integracao
          path: reports/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t openwallet .
      - run: docker build -f apps/api/Dockerfile -t openwallet-api .
      - run: docker build -f apps/web/Dockerfile -t openwallet-web .
      - run: docker build -f apps/openfinance-mock/Dockerfile -t openwallet-openfinance-mock .
