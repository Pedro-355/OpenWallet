# Deploy gratuito no Render (https://render.com): Dashboard → New → Blueprint → este repositório.
# Sobe um serviço "tudo em um" (API + worker + Banco Sandbox + tela web), Postgres e Key Value (Redis).
#
# Limites do plano free: o serviço dorme após ~15 min sem acesso (o 1º acesso demora ~1 min),
# e o Postgres free expira em 30 dias. Para produção, troque os planos e separe o worker
# (type: worker, startCommand: node apps/api/dist/worker.js).
services:
  - type: web
    name: openwallet
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && VITE_API_URL= npm run build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: openwallet-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: openwallet-kv
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: RUN_WORKER
        value: "true"
      - key: SANDBOX_BANK
        value: "true"
      - key: SERVE_WEB_DIR
        value: apps/web/dist
      - key: DB_POOL_MAX
        value: "5"

  - type: keyvalue
    name: openwallet-kv
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: openwallet-db
    plan: free
    databaseName: openwallet
